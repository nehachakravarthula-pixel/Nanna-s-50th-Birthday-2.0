<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nanna — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.06), transparent 30%),
        #060b18;
      color: #f5f1e8;
      font-family: Arial, sans-serif;
    }

    .wrap {
      width: min(1100px, 92%);
      margin: auto;
      padding: 45px 0 60px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }

    .eyebrow {
      color: #c9b27c;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-size: 11px;
      margin-bottom: 10px;
    }

    h1 {
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: clamp(34px, 5vw, 55px);
      margin: 0;
    }

    .sub {
      color: #aeb5c2;
      margin-top: 10px;
    }

    button {
      border: 1px solid #c9b27c;
      background: transparent;
      color: #f5f1e8;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: rgba(201,178,124,.12);
    }

    .login-card,
    .panel {
      background: rgba(245,241,232,.045);
      border: 1px solid rgba(201,178,124,.25);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .login-card {
      max-width: 500px;
      margin: 80px auto;
    }

    .login-card h2,
    .panel h2 {
      font-family: Georgia, serif;
      font-weight: 400;
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0 14px;
      border-radius: 8px;
      border: 1px solid #394254;
      background: #0d1424;
      color: white;
      font-size: 15px;
    }

    .login-btn {
      width: 100%;
      background: #c9b27c;
      color: #101522;
      border: none;
      font-weight: bold;
    }

    .message {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      padding: 20px;
      margin-top: 18px;
      background: rgba(0,0,0,.15);
    }

    .message-head {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .name {
      font-family: Georgia, serif;
      font-size: 22px;
    }

    .date {
      color: #8f98a8;
      font-size: 12px;
      margin-top: 5px;
    }

    .message-text {
      color: #d9dce2;
      line-height: 1.7;
      white-space: pre-wrap;
      margin: 18px 0;
    }

    .message img {
      max-width: 300px;
      max-height: 300px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      margin-top: 12px;
    }

    .delete {
      border-color: #9d6f6f;
      color: #e7bebe;
    }

    .status {
      color: #aeb5c2;
      margin: 15px 0;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 650px) {
      .wrap {
        padding-top: 28px;
      }

      .top {
        align-items: flex-start;
      }

      .message-head {
        flex-direction: column;
      }

      .message img {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <div id="loginScreen" class="login-card">
    <div class="eyebrow">Private area</div>
    <h2>Nanna's 50th</h2>
    <p class="sub">Admin access only.</p>

    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Password">

    <button class="login-btn" onclick="login()">Sign in</button>

    <p id="loginStatus" class="status"></p>
  </div>


  <main id="adminScreen" class="wrap hidden">

    <div class="top">
      <div>
        <div class="eyebrow">Private dashboard</div>
        <h1>Messages for Nanna</h1>
        <div class="sub">Manage the messages people have left.</div>
      </div>

      <button onclick="logout()">Sign out</button>
    </div>

    <section class="panel">
      <h2>All messages</h2>
      <div id="status" class="status">Loading messages...</div>
      <div id="messages"></div>
    </section>

  </main>


<script>
const SUPABASE_URL = "https://yhgmtvcaptgvmqnczeuc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_DUCqevIEFnRrJL4UuwiUoQ_wRYgIYD0";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


// Check whether the current logged-in user is actually an admin
async function checkAdmin() {
  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    showLogin();
    return false;
  }

  const { data, error } = await supabaseClient
    .from("admins")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error || !data) {
    await supabaseClient.auth.signOut();
    document.getElementById("loginStatus").textContent =
      "This account does not have admin access.";
    showLogin();
    return false;
  }

  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("adminScreen").classList.remove("hidden");

  await loadMessages();
  return true;
}


// Login
async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const status = document.getElementById("loginStatus");
  status.textContent = "Signing in...";

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    status.textContent = error.message;
    return;
  }

  await checkAdmin();
}


// Load messages
async function loadMessages() {
  const container = document.getElementById("messages");
  const status = document.getElementById("status");

  status.textContent = "Loading messages...";

  const { data, error } = await supabaseClient
    .from("messages")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    status.textContent = "Could not load messages: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    status.textContent = "No messages yet.";
    container.innerHTML = "";
    return;
  }

  status.textContent = data.length + " message" + (data.length === 1 ? "" : "s");

  container.innerHTML = data.map(message => {

    const date = new Date(message.created_at).toLocaleString(
      "en-IN",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );

    const photo = message.photo_url
      ? `<img src="${escapeHtml(message.photo_url)}" alt="Attached photo">`
      : "";

    return `
      <article class="message">
        <div class="message-head">
          <div>
            <div class="name">${escapeHtml(message.name)}</div>
            <div class="date">${date}</div>
          </div>

          <button
            class="delete"
            onclick="deleteMessage(${message.id})">
            Delete
          </button>
        </div>

        <div class="message-text">${escapeHtml(message.message)}</div>

        ${photo}
      </article>
    `;
  }).join("");
}


// Delete a message
async function deleteMessage(id) {

  const confirmed = confirm(
    "Are you sure you want to delete this message?"
  );

  if (!confirmed) return;

  const { error } = await supabaseClient
    .from("messages")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Could not delete message: " + error.message);
    return;
  }

  await loadMessages();
}


// Logout
async function logout() {
  await supabaseClient.auth.signOut();
  showLogin();
}


// Show login
function showLogin() {
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("adminScreen").classList.add("hidden");
}


// Prevent HTML injection
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


// Check existing login when page opens
checkAdmin();
</script>

</body>
</html>
